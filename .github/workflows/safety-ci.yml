name: Safety and Contract CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  safety-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: pytest tests/contract tests/safety
      - name: Cross-language protocol golden vectors
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic \
            tests/contract/protocol_cpp_golden.cpp -o /tmp/rci_protocol_golden
          /tmp/rci_protocol_golden
      - name: Robot firmware safety runtime
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic \
            tests/contract/robot_firmware_runtime.cpp -o /tmp/rci_robot_runtime
          /tmp/rci_robot_runtime
      - name: Single-servo HIL firmware guard
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic \
            tests/contract/single_servo_hil_guard.cpp -o /tmp/rci_single_servo_hil_guard
          /tmp/rci_single_servo_hil_guard
