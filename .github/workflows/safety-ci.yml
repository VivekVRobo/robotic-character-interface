name: Safety and Contract CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  safety-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: pytest tests/contract tests/safety
