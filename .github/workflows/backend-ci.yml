name: Backend CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff check src tests tools
      - run: ruff format --check src tests tools
      - run: mypy src/rci
      - run: pytest tests/unit
      - name: Deterministic digital-twin soak benchmark
        run: python tools/run_simulation_benchmark.py --repetitions 3 --output reports/simulation/ci-benchmark.json
      - name: Upload simulation benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: rci-simulation-benchmark
          path: reports/simulation/ci-benchmark.json
