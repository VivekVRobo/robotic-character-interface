[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "robotic-character-interface"
version = "0.1.0-dev0"
description = "Safety-governed multimodal AI character embodiment robotics platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "PyYAML>=6.0.2",
  "numpy>=2.0",
  "pyserial>=3.5",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.8",
]

[project.scripts]
rci = "rci.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rci"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
  "hardware: requires physical hardware",
  "hil: hardware-in-the-loop",
  "slow: long-running test",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["rci"]
